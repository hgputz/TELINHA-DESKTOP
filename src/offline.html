<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Telinha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #09090b;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .box { max-width: 380px; padding: 32px; text-align: center; }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
    p { font-size: 13px; line-height: 1.6; color: #a1a1aa; }
    code {
      font-size: 12px;
      color: #71717a;
      display: block;
      margin-top: 14px;
      word-break: break-all;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      margin-top: 22px;
      padding: 9px 22px;
      border: 0;
      border-radius: 8px;
      background: #fafafa;
      color: #09090b;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Não foi possível abrir a Telinha</h1>
    <p>O app precisa de internet para conectar ao site. Verifique a conexão e tente de novo.</p>
    <code id="detail"></code>
    <button id="retry" type="button">Tentar de novo</button>
  </div>
  <script>
    document.getElementById("detail").textContent = decodeURIComponent(location.hash.slice(1))
    document.getElementById("retry").addEventListener("click", () => window.offlineScreen.retry())
  </script>
</body>
</html>
