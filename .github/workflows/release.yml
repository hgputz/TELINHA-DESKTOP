# Empacota o instalador e sobe como rascunho de release.
#
# O build não sai da máquina do dev por preguiça, e sim por necessidade: para
# assinar o desinstalador, o electron-builder monta um instalador temporário e
# o executa. Em Windows 11 com Smart App Control em enforcement, o sistema
# recusa executar qualquer binário não assinado — inclusive esse temporário — e
# o build morre com `spawn UNKNOWN` depois de gerar os 100 MB do pacote. O
# runner do GitHub não tem Smart App Control, então lá o build fecha.
#
# Sobe como rascunho de propósito: mídia se valida com teste manual em máquina
# de verdade, e binário não testado não vira link público sozinho.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Empacotar e publicar como rascunho
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/Telinha-Setup.exe
